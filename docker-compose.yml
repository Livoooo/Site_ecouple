services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Signaling WebRTC + conversations : hébergés sur le vrai cloud
        # PartyKit (Cloudflare), pas auto-hébergé — pas de conteneur "party"
        # à maintenir ici, et le stockage survit aux redéploiements de ce
        # service puisqu'il est complètement séparé.
        #
        # Valeur en dur volontairement (pas de ${...}) : NEXT_PUBLIC_* est
        # figé dans le bundle navigateur au moment du build, donc une
        # variable d'env Coolify du même nom (héritée de l'ancien service
        # auto-hébergé "party.jundo.cloud") l'écraserait silencieusement.
        NEXT_PUBLIC_PARTYKIT_HOST: watch-party-signaling.Livoooo.partykit.dev
        APP_PORT: 3000
    image: watch-party-app-web:latest
    command: ["npm", "run", "start"]
    expose:
      - "3000"
    environment:
      SITE_PASSWORD: ${SITE_PASSWORD:-changeme123}
      # Utilisé uniquement côté serveur (voir src/lib/party-http.ts) pour ne
      # pas dépendre de NEXT_PUBLIC_PARTYKIT_HOST, qui peut être écrasé par
      # une variable d'env Coolify périmée qu'on ne contrôle pas.
      PARTYKIT_SERVER_HOST: watch-party-signaling.Livoooo.partykit.dev
    restart: unless-stopped
