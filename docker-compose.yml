x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  args:
    NEXT_PUBLIC_PARTYKIT_HOST: ${NEXT_PUBLIC_PARTYKIT_HOST:-localhost:1999}

services:
  party:
    build: *app-build
    image: watch-party-app:latest
    command: ["npx", "partykit", "dev", "--port", "1999"]
    expose:
      - "1999"
    restart: unless-stopped

  web:
    build: *app-build
    image: watch-party-app:latest
    command: ["npm", "run", "start"]
    expose:
      - "3000"
    environment:
      SITE_PASSWORD: ${SITE_PASSWORD:-changeme123}
    depends_on:
      - party
    restart: unless-stopped
